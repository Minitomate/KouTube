[package]
name = "koutube"
version = "1.2.0"
description = "KouTube - compact local YouTube downloader"
edition = "2021"
rust-version = "1.77"

# Mobile (lib) + desktop (bin) targets; Android builds the cdylib.
[lib]
name = "koutube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
nix = { version = "0.29", features = ["process", "signal", "fs"] }
anyhow = "1"
zip = "2"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }

# No OS trash concept on Android; trash_file falls back to a plain delete.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

# Android runs yt-dlp through the bundled youtubedl-android library: Kotlin
# bridge reached over JNI instead of spawning a sidecar.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
